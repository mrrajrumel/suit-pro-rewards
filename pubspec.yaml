name: suit_pro_rewards_flutter
description: "A new Flutter project for Suit Pro Rewards, migrated from React Native."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.3
  firebase_storage: ^12.1.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.5.0+1

  # Routing
  go_router: ^14.2.1

  # UI & UX
  lucide_flutter: ^1.12.0
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0
  flutter_markdown: ^0.7.1
  fluttertoast: ^8.2.6

  # Utility
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.2
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

